- type: entity
  parent: FoodBakedCroissant
  id: WeaponCroissant
  suffix: Weapon
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: LandAtCursor
  - type: DamageOtherOnHit
    ignoreResistances: true
    damage:
      types:
        Slash: 10 # collard-LifeValue
        Piercing: 20 # collard-LifeValue
  - type: ThrowingAngle
    angularVelocity: true # spins
