- type: entity
  parent: BaseMachinePowered
  id: ClamshellGrillBase
  abstract: true
  components:
  # generic appearance and locker stuff
  - type: Sprite
    sprite: Structures/Storage/closet.rsi
    noRot: true
    layers:
    - state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - state: generic_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        enum.PaperLabelVisuals.Layer:
          True: { visible: false }
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: generic_door
  - type: Animateable
  - type: Machine
    board: ClamshellGrillMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: true
  # actual grill stuff
  - type: ClamshellGrill
    crushingDamage:
      types:
        Blunt: 10
  - type: UserInterface
    interfaces:
      enum.ClamshellGrillUiKey.Key:
        type: ClamshellGrillBoundUserInterface
  - type: ApcPowerReceiver
    load: 5000
  - type: Transform
    anchored: true
  - type: AccessReader # access for creating and deleting programs
    access: [["Service"]]
    examinationText: access-reader-examination-functionality-restricted
  - type: Lock
    locked: false
    lockingSound: /Audio/Effects/card_drag.ogg
    unlockingSound: /Audio/Effects/card_drag.ogg
    useAccess: false
  - type: LockVisuals
  - type: EntityStorage
    open: True
    closeSound: /Audio/Effects/docking.ogg
    openSound: /Audio/Effects/docking.ogg
    removedMasks: 0
    masksToRemove: 0
  - type: Pullable
  placement:
    mode: SnapgridCenter

- type: entity
  parent: [ ClamshellGrillBase , ConstructibleMachine ]
  id: ClamshellGrill
  name: clamshell grill
  description: A robust one-platen clamshell grill, capable of thoroughly cooking your stuff from two sides simultaneously.
  suffix: 1 platen
  components:
  # - type: Fixtures
  #   fixtures:
  #     fix1:
  #       shape: !type:PolygonShape
  #         radius: 0.01
  #         vertices:
  #         - -0.25,-0.48
  #         - 0.25,-0.48
  #         - 0.25,0.48
  #         - -0.25,0.48
  #       mask:
  #       - Impassable
  #       - TableLayer
  #       - LowImpassable
  #       layer:
  #       - BulletImpassable
  #       - Opaque
  #       density: 75
  #       hard: True
  #       restitution: 0
  #       friction: 0.4
  - type: Sprite
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.25,-0.48
          - 0.25,-0.48
          - 0.25,0.48
          - -0.25,0.48
        density: 55
        mask: # tables should collide with other tables
        - Impassable
        layer:
        - TableLayer
  - type: EntityStorage
  - type: Construction
    containers:
    - machine_parts
    - machine_board
    - entity_storage
