- type: entity
  id: ActionChangePose
  name: Change pose
  description: Change character pose
  components:
  - type: Action
    useDelay: 1
    icon: Interface/Emotes/weh.png
    checkCanInteract: false
  - type: InstantAction
    event: !type:ChangePoseActionEvent

- type: entity
  id: ActionChangeFlavor
  name: Change flavor
  description: Change character flavor text
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Structures/Decoration/mannequin.rsi
      state: mannequin
    checkCanInteract: false
  - type: InstantAction
    event: !type:ChangeFlavorActionEvent
