- type: gameMap
  id: Agroterminal
  mapName: 'Агротерминал Мини'
  mapPath: /Maps/Collard/agroterminal.yml
  minPlayers: 0
  stations:
    Agroterminal:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} {1} Агротерминал Мини v1.4'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'COM'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Collard/Shuttles/agro_evac.yml
        - type: StationCargoShuttle
          path: /Maps/Collard/Shuttles/agro_cargo.yml
        - type: StationJobs
          availableJobs:
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service
            Bartender: [ 1, 1 ]
            Botanist: [ -1, -1 ]
            Cook: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            #engineering
            StationEngineer: [ 2, 2 ]
            TechnicalAssistant: [ 1, 1 ]
            #medical
            Chemist: [ 1, 1 ]
            MedicalDoctor: [ 2, 2 ]
            MedicalIntern: [ 2, 2 ]
            #science
            Scientist: [ 2, 2 ]
            ResearchAssistant: [ 2, 2 ]
            #security
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 2, 2 ]
            SecurityCadet: [ 1, 1 ]
            #supply
            CargoTechnician: [ -1, -1 ]
            #civilian
            Passenger: [ -1, -1 ]
            Gatecrasher: [ -1, -1 ]
        - type: StationGoal
          goals:
          - Money1M
          - Money25M
          - Seeds
